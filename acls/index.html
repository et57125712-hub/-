<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ACLS MegaCode Academy</title><style>:root{--bg:#050b14;--card:#0d1b2b;--line:#254765;--txt:#eef8ff;--muted:#9fb3c8;--cyan:#46dcff;--green:#66efaa;--red:#ff5f78;--gold:#ffd166}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at top,#17385a,#050b14 46%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;min-height:100vh}button{font:inherit}.app{max-width:1000px;margin:auto;padding:15px 13px 100px}header,.top{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:clamp(1.35rem,5vw,2.25rem)}.muted{color:var(--muted)}.card{background:linear-gradient(145deg,#132b45,#0a1828);border:1px solid var(--line);border-radius:22px;padding:17px;margin:13px 0;box-shadow:0 18px 48px #0008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.btn,.option{border:0;border-radius:15px;padding:14px;font-weight:850;cursor:pointer}.btn{background:linear-gradient(135deg,var(--cyan),#7085ff);color:#04111d}.btn.alt{background:#17314b;color:var(--txt);border:1px solid #365c80}.mode{text-align:left}.mode b{display:block}.mode span{display:block;color:#16304a;font-size:.78rem;margin-top:3px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#081522;border-radius:14px;text-align:center;padding:11px}.stat b{display:block;font-size:1.25rem}.stat span{font-size:.72rem;color:var(--muted)}.hidden{display:none!important}.question{font-size:1.17rem;line-height:1.55;margin:16px 0}.option{width:100%;margin:7px 0;text-align:left;background:#081522;color:var(--txt);border:1px solid #315676}.option.correct{background:#123b2f;border-color:var(--green)}.option.wrong{background:#421c29;border-color:var(--red)}.feedback{background:#081522;border-radius:14px;padding:13px;margin-top:11px;line-height:1.55}.progress{height:8px;background:#06101a;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}.chapter{text-align:left}.chapter small{display:block;color:var(--muted);margin-top:4px}.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:#06101aee;border-top:1px solid #254765;backdrop-filter:blur(14px)}.bottom button{flex:1;max-width:320px}.monitor{position:relative;overflow:hidden;background:#020806;border:2px solid #1d4f3a;border-radius:18px;padding:12px;box-shadow:inset 0 0 30px #00ff6630,0 0 22px #00ff4420}.ecg{height:105px;width:100%}.ecg path{fill:none;stroke:#67ff9c;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 5px #34ff78);stroke-dasharray:900;animation:trace 2.2s linear infinite}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}.rhythm{position:absolute;top:8px;left:12px;color:#67ff9c;font-weight:900}.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.vital{background:#07131f;border-radius:11px;padding:9px;text-align:center}.vital b{display:block;font-size:1.2rem}.vital span{font-size:.68rem;color:var(--muted)}.code-banner{position:fixed;inset:0;display:grid;place-items:center;background:#b40020e8;color:#fff;font-size:clamp(2.1rem,10vw,5rem);font-weight:1000;z-index:99;animation:alarm .25s 6 alternate}@keyframes alarm{to{background:#180006e8}}.flash{position:fixed;inset:0;background:#fff;z-index:100;pointer-events:none;animation:flash .5s forwards}@keyframes flash{from{opacity:1}to{opacity:0}}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:90;background:#071522;border:2px solid var(--cyan);border-radius:18px;padding:18px 24px;font-size:1.4rem;font-weight:950;box-shadow:0 0 45px var(--cyan);animation:pop 1.15s forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}.autonext{margin-top:8px;color:var(--gold);font-weight:900}.timer{font-weight:950;color:var(--gold)}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.vitals{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="app"><header><div><h1>🚑 ACLS MegaCode Academy</h1><div class="muted">206 題完整題庫＋自動連續情境</div></div><button class="btn alt" id="soundBtn">🔊</button></header><section id="home"><div class="card"><h2>考前全域訓練</h2><div class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="acc">0%</b><span>正確率</span></div><div class="stat"><b id="wrong">0</b><span>錯題</span></div><div class="stat"><b id="covered">0/206</b><span>已練題數</span></div></div></div><div class="grid"><button class="btn mode" id="allBtn"><b>📚 206 題全部練習</b><span>作答後自動下一題</span></button><button class="btn mode" id="mockBtn"><b>📝 50 題模擬考</b><span>即時解析後自動前進</span></button><button class="btn mode" id="wrongBtn"><b>🔁 錯題再測</b><span>集中修正弱點</span></button><button class="btn mode" id="megaBtn"><b>🚨 MegaCode 情境</b><span>連續決策自動推進</span></button></div><h2>分章題庫</h2><div id="chapters" class="grid"></div></section><section id="quiz" class="card hidden"><div class="top"><button class="btn alt" id="quizBack">← 返回</button><b id="prog"></b></div><div class="progress"><i id="bar"></i></div><div class="muted" id="label"></div><div class="question" id="q"></div><div id="opts"></div><div id="fb" class="feedback hidden"></div><div id="autoQuiz" class="autonext hidden"></div></section><section id="mega" class="hidden"><div class="card"><div class="top"><button class="btn alt" id="megaBack">← 返回</button><b>情境中心</b></div><div id="megaList" class="grid"></div></div></section><section id="case" class="hidden"><div class="card"><div class="top"><button class="btn alt" id="caseBack">← 情境列表</button><b class="timer" id="timer">30</b></div><h2 id="caseTitle"></h2><div class="card" id="caseText"></div><div class="monitor"><div class="rhythm" id="rhythm">VF</div><svg class="ecg" viewBox="0 0 900 120" preserveAspectRatio="none"><path id="ecgPath" d="M0 60 L900 60"/></svg><div class="vitals"><div class="vital"><b id="hr">0</b><span>HR</span></div><div class="vital"><b id="bp">--/--</b><span>BP</span></div><div class="vital"><b id="spo2">--</b><span>SpO₂</span></div><div class="vital"><b id="etco2">8</b><span>ETCO₂</span></div><div class="vital"><b id="hp">100</b><span>Patient HP</span></div></div></div><div class="question">下一步處置？</div><div id="caseOpts"></div><div id="caseFb" class="feedback hidden"></div><div id="autoCase" class="autonext hidden"></div></div></section></main><div class="bottom"><button class="btn alt" id="homeBtn">首頁</button><button class="btn" id="bottomWrong">錯題複習</button></div><script src="q1.js"></script><script src="q2.js"></script><script src="q3.js"></script><script src="q4.js"></script><script>'use strict';const $=s=>document.querySelector(s),Q=Array.isArray(window.ACLS_QUESTIONS)?window.ACLS_QUESTIONS:[];let S;try{S=JSON.parse(localStorage.getItem('aclsMegaSave')||'{}')}catch(e){S={}}S=Object.assign({done:0,correct:0,wrong:{},seen:{},sound:true},S);let list=[],idx=0,right=0,mode='',locked=false,autoTimer=null,ci=0,si=0,hp=100,countdown=null,time=30;const waves={VF:'M0 60 '+Array.from({length:60},(_,i)=>'L'+(i*15)+' '+(25+Math.random()*70)).join(' '),VT:'M0 60 '+Array.from({length:25},(_,i)=>'L'+(i*36)+' '+(i%2?95:20)).join(' '),PEA:'M0 60 L80 60 L95 35 L110 90 L125 60 L220 60 L235 35 L250 90 L265 60 L900 60',Asystole:'M0 60 L900 60',PSVT:'M0 60 '+Array.from({length:35},(_,i)=>'L'+(i*26)+' '+(i%2?85:35)).join(' '),ROSC:'M0 60 L80 60 L90 50 L100 60 L110 15 L125 95 L140 60 L165 48 L190 60 L900 60'};function tone(f=600,d=.12){if(!S.sound)return;try{const A=new (AudioContext||webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=f;g.gain.value=.05;o.start();g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.stop(A.currentTime+d)}catch(e){}}function fx(kind,text){if(navigator.vibrate)navigator.vibrate(kind==='shock'?[80,50,120]:kind==='bad'?[60,40,60]:30);if(kind==='shock'){const e=document.createElement('div');e.className='flash';document.body.append(e);setTimeout(()=>e.remove(),550);tone(180,.25)}const t=document.createElement('div');t.className='toast';t.textContent=text;document.body.append(t);setTimeout(()=>t.remove(),1200);tone(kind==='bad'?180:780)}function codeBlue(){const e=document.createElement('div');e.className='code-banner';e.innerHTML='🚨 CODE BLUE<br><small>TEAM LEADER MODE</small>';document.body.append(e);tone(220,.8);setTimeout(()=>e.remove(),1500)}function save(){localStorage.setItem('aclsMegaSave',JSON.stringify(S));stats()}function stats(){$('#done').textContent=S.done||0;$('#acc').textContent=S.done?Math.round(S.correct/S.done*100)+'%':'0%';$('#wrong').textContent=Object.keys(S.wrong||{}).length;$('#covered').textContent=Object.keys(S.seen||{}).length+'/'+Q.length}function clearAll(){clearTimeout(autoTimer);clearInterval(countdown)}function hide(){clearAll();['home','quiz','mega','case'].forEach(x=>$('#'+x).classList.add('hidden'))}function home(){hide();$('#home').classList.remove('hidden');chapters();stats();scrollTo(0,0)}function chapters(){const m={};Q.forEach(x=>(m[x.chapter]??=[]).push(x));$('#chapters').innerHTML='';Object.entries(m).forEach(([c,a])=>{const b=document.createElement('button');b.className='card chapter';b.innerHTML='<b>'+c+'</b><small>'+a.length+' 題</small>';b.onclick=()=>begin(a,c);$('#chapters').append(b)})}function begin(a,m){if(!a.length)return alert('目前沒有題目。');list=[...a];idx=0;right=0;mode=m;hide();$('#quiz').classList.remove('hidden');renderQ()}function renderQ(){locked=false;const x=list[idx];$('#prog').textContent=(idx+1)+' / '+list.length;$('#bar').style.width=(idx/list.length*100)+'%';$('#label').textContent=mode+'｜題號 '+x.id+'｜'+x.chapter;$('#q').textContent=x.q;$('#opts').innerHTML='';x.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML='<b>'+String.fromCharCode(65+i)+'.</b> '+o;b.onclick=()=>answer(i);$('#opts').append(b)});$('#fb').classList.add('hidden');$('#autoQuiz').classList.add('hidden')}function answer(i){if(locked)return;locked=true;const x=list[idx],ok=i===x.answer;document.querySelectorAll('#opts .option').forEach((b,j)=>{b.disabled=true;if(j===x.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});S.done++;S.seen[x.id]=1;if(ok){S.correct++;right++;delete S.wrong[x.id];fx('good','✅ 答對了')}else{S.wrong[x.id]=(S.wrong[x.id]||0)+1;fx('bad','❌ 正確答案 '+String.fromCharCode(65+x.answer))}save();$('#fb').innerHTML='<strong>'+(ok?'答對了':'正確答案：'+String.fromCharCode(65+x.answer))+'</strong><br>'+(x.explain||'');$('#fb').classList.remove('hidden');let sec=ok?2:3;$('#autoQuiz').classList.remove('hidden');$('#autoQuiz').textContent=sec+' 秒後自動下一題';const iv=setInterval(()=>{sec--;$('#autoQuiz').textContent=sec>0?sec+' 秒後自動下一題':'正在前往下一題…';if(sec<=0)clearInterval(iv)},1000);autoTimer=setTimeout(nextQ,ok?2000:3000)}function nextQ(){if(++idx>=list.length){alert('完成！'+right+'/'+list.length);home()}else renderQ()}const C=[{t:'VF 反覆電擊',r:'VF',v:['0','--/--','--','7'],s:[['58歲男性突然倒地，無反應、無脈搏，監視器顯示 VF。',['開始高品質 CPR 並立即去顫','先插管再處理','Atropine 1 mg','同步整流'],0,'shock','可電擊心律應立刻 CPR 與去顫。'],['第一次去顫後仍為 VF。',['立即恢復 CPR 2 分鐘','立刻停下摸脈搏','連續電擊三次','Adenosine'],0,'cpr','電擊後立即恢復 CPR。'],['第二次去顫後仍為 VF。',['Epinephrine 1 mg IV/IO','Atropine','Dopamine','停止 CPR'],0,'drug','持續 CPR 並每 3–5 分鐘給 Epinephrine。'],['第三次去顫後仍為 VF。',['Amiodarone 300 mg IV/IO','Adenosine','同步整流','觀察'],0,'drug','頑固 VF/pVT 可使用 Amiodarone。']]},{t:'PEA—張力性氣胸',r:'PEA',v:['35','--/--','71','6'],s:[['無脈搏，右側呼吸音消失、頸靜脈怒張。',['CPR、Epinephrine 並找 5H5T','立即去顫','Adenosine','Atropine'],0,'cpr','PEA 不電擊。'],['高度懷疑張力性氣胸。',['立即胸部減壓','等待 X 光','同步整流','只提高氧氣'],0,'drug','不可等待影像。']]},{t:'第三度 AV block',r:'ROSC',v:['32','74/40','89','28'],s:[['病人胸痛、意識混亂，第三度 AV block。',['Atropine 1 mg 並準備 TCP','Adenosine','去顫','觀察'],0,'drug','高度阻滯常需 pacing。'],['Atropine 無效。',['立即 TCP，考慮 Dopamine/Epinephrine infusion','再等 10 分鐘','同步整流','Amiodarone'],0,'shock','不穩定心搏過緩應立即節律器支持。']]},{t:'不穩定單型 VT',r:'VT',v:['178','68/38','88','24'],s:[['有脈搏單型 VT，伴低血壓與意識改變。',['同步整流，若可行先鎮靜','Adenosine','Atropine','只給氧'],0,'shock','不穩定有脈搏 VT 需同步整流。']]},{t:'穩定 PSVT',r:'PSVT',v:['186','118/72','96','31'],s:[['規則窄 QRS，血壓穩定。',['迷走神經刺激','立即去顫','Atropine','Amiodarone'],0,'cpr','穩定規則窄 QRS 可先迷走刺激。'],['迷走刺激無效。',['Adenosine 6 mg 快速推注','Epinephrine','Lidocaine','同步整流'],0,'drug','Adenosine 必須快速推注並立即沖管。']]},{t:'Asystole',r:'Asystole',v:['0','--/--','--','4'],s:[['兩個導程確認 Asystole。',['高品質 CPR、Epinephrine、找 5H5T','去顫 200J','Atropine','TCP'],0,'cpr','Asystole 不可電擊。']]},{t:'ROSC 後照護',r:'ROSC',v:['92','78/46','84','32'],s:[['恢復脈搏但仍昏迷、低氧與低血壓。',['調整氧合通氣、治療低血壓、12 導程 ECG 與溫度控制','過度換氣','停止監測','只給鎮靜'],0,'rosc','需系統性 ROSC 後照護。']]}];function showMega(){hide();$('#mega').classList.remove('hidden');$('#megaList').innerHTML='';C.forEach((c,i)=>{const b=document.createElement('button');b.className='card chapter';b.innerHTML='<b>🚨 '+c.t+'</b><small>'+c.s.length+' 個連續決策點</small>';b.onclick=()=>startCase(i);$('#megaList').append(b)})}function startCase(i){ci=i;si=0;hp=100;hide();$('#case').classList.remove('hidden');codeBlue();renderCase()}function setWave(r){$('#rhythm').textContent=r;$('#ecgPath').setAttribute('d',waves[r]||waves.ROSC)}function renderCase(){clearAll();locked=false;const c=C[ci],s=c.s[si];$('#caseTitle').textContent=c.t;$('#caseText').textContent=s[0];setWave(c.r);$('#hr').textContent=c.v[0];$('#bp').textContent=c.v[1];$('#spo2').textContent=c.v[2];$('#etco2').textContent=c.v[3];$('#hp').textContent=hp;$('#caseOpts').innerHTML='';s[1].forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>caseAnswer(i);$('#caseOpts').append(b)});$('#caseFb').classList.add('hidden');$('#autoCase').classList.add('hidden');time=30;$('#timer').textContent=time;countdown=setInterval(()=>{time--;$('#timer').textContent=time;if(time<=0){clearInterval(countdown);caseAnswer(-1)}},1000)}function caseAnswer(i){if(locked)return;locked=true;clearInterval(countdown);const s=C[ci].s[si],ok=i===s[2];document.querySelectorAll('#caseOpts .option').forEach((b,j)=>{b.disabled=true;if(j===s[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});if(ok){hp=Math.min(100,hp+5);fx(s[3],s[3]==='shock'?'⚡ CLEAR！SHOCK！':s[3]==='drug'?'💉 藥物已給予':'🫀 正確處置')}else{hp=Math.max(0,hp-25);fx('bad','❌ 病人惡化')}$('#hp').textContent=hp;$('#caseFb').innerHTML='<strong>'+(ok?'決策正確':'決策錯誤')+'</strong><br>'+s[4];$('#caseFb').classList.remove('hidden');let sec=ok?2:3;$('#autoCase').classList.remove('hidden');$('#autoCase').textContent=sec+' 秒後病況自動更新';const iv=setInterval(()=>{sec--;$('#autoCase').textContent=sec>0?sec+' 秒後病況自動更新':'正在更新病況…';if(sec<=0)clearInterval(iv)},1000);autoTimer=setTimeout(nextStep,ok?2000:3000)}function nextStep(){if(++si>=C[ci].s.length){alert('情境完成！Patient HP：'+hp);showMega()}else renderCase()}$('#allBtn').onclick=()=>begin(Q,'206 題全部練習');$('#mockBtn').onclick=()=>begin([...Q].sort(()=>Math.random()-.5).slice(0,50),'50 題模擬考');$('#wrongBtn').onclick=$('#bottomWrong').onclick=()=>{const a=Q.filter(x=>S.wrong&&S.wrong[x.id]);a.length?begin(a,'錯題再測'):alert('目前沒有錯題。')};$('#megaBtn').onclick=showMega;$('#quizBack').onclick=$('#megaBack').onclick=$('#homeBtn').onclick=home;$('#caseBack').onclick=showMega;$('#soundBtn').onclick=()=>{S.sound=!S.sound;$('#soundBtn').textContent=S.sound?'🔊':'🔇';save()};$('#soundBtn').textContent=S.sound?'🔊':'🔇';home();</script></body></html>
