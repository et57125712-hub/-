<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ACLS MegaCode Academy</title><style>
:root{--bg:#07111e;--card:#102238;--line:#284b70;--txt:#f2f8ff;--muted:#9fb4c9;--cyan:#47d9ff;--green:#69efad;--red:#ff7188;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16385d,#07111e 45%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button,select{font:inherit}.app{max-width:980px;margin:auto;padding:16px 14px 100px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:clamp(1.4rem,5vw,2.2rem);margin:0}.muted{color:var(--muted)}.card{background:linear-gradient(145deg,#142b46,#0d1d30);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 16px 42px #0006}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.btn{border:0;border-radius:15px;padding:14px;background:linear-gradient(135deg,var(--cyan),#6f83ff);font-weight:900;color:#04111d;cursor:pointer}.btn.alt{background:#17314d;color:var(--txt);border:1px solid #345c82}.mode{text-align:left}.mode b{display:block;font-size:1.05rem}.mode span{font-size:.8rem;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#091827;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:1.25rem}.stat span{font-size:.72rem;color:var(--muted)}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.question{font-size:1.18rem;line-height:1.55;margin:18px 0}.option{width:100%;text-align:left;padding:14px;margin:7px 0;border-radius:14px;background:#091827;color:var(--txt);border:1px solid #315579}.option.correct{background:#123b2f;border-color:var(--green)}.option.wrong{background:#421d2b;border-color:var(--red)}.feedback{padding:14px;margin-top:12px;border-radius:14px;background:#091827;line-height:1.55}.progress{height:8px;background:#08131f;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}.chapter{cursor:pointer}.chapter b{display:block}.chapter small{color:var(--muted)}.casebox{background:#081827;border-left:4px solid var(--gold);padding:14px;border-radius:12px;margin:12px 0}.vitals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.vitals div{background:#0b1b2d;border-radius:10px;padding:9px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#07111eef;backdrop-filter:blur(14px);border-top:1px solid #264765;padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}.bottom button{max-width:320px;flex:1}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><header><div><h1>🚑 ACLS MegaCode Academy</h1><div class="muted">206 題完整題庫＋MegaCode 連續決策</div></div><b id="streak">🔥 0</b></header>
<section id="home"><div class="card"><h2>考前全域訓練</h2><div class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="acc">0%</b><span>正確率</span></div><div class="stat"><b id="wrong">0</b><span>錯題</span></div><div class="stat"><b id="covered">0/206</b><span>已練題數</span></div></div></div><div class="grid"><button class="btn mode" onclick="startAll()"><b>📚 206 題全部練習</b><span>依題號逐題完成，記錄進度</span></button><button class="btn mode" onclick="startMock()"><b>📝 50 題模擬考</b><span>隨機抽題，考後統一檢討</span></button><button class="btn mode" onclick="startWrong()"><b>🔁 錯題再測</b><span>只練曾經答錯的題目</span></button><button class="btn mode" onclick="showMega()"><b>⚡ MegaCode 情境</b><span>12 組連續臨床決策</span></button></div><h2>分章題庫</h2><div id="chapters" class="grid"></div></section>
<section id="quiz" class="card hidden"><div class="top"><button class="btn alt" onclick="home()">← 返回</button><b id="prog"></b></div><div class="progress"><i id="bar"></i></div><div class="muted" id="label"></div><div class="question" id="q"></div><div id="opts"></div><div id="fb" class="feedback hidden"></div><button id="next" class="btn hidden" style="width:100%;margin-top:12px" onclick="nextQ()">下一題</button></section>
<section id="mega" class="hidden"><div class="card"><div class="top"><button class="btn alt" onclick="home()">← 返回</button><b>MegaCode</b></div><div id="megaList" class="grid"></div></div></section>
<section id="case" class="card hidden"><div class="top"><button class="btn alt" onclick="showMega()">← 情境列表</button><b id="caseProg"></b></div><h2 id="caseTitle"></h2><div class="casebox" id="caseText"></div><div class="vitals" id="vitals"></div><div class="question" id="caseQ"></div><div id="caseOpts"></div><div id="caseFb" class="feedback hidden"></div><button id="caseNext" class="btn hidden" style="width:100%;margin-top:12px" onclick="nextStep()">病況更新 →</button></section></main><div class="bottom"><button class="btn alt" onclick="home()">首頁</button><button class="btn" onclick="startWrong()">錯題複習</button></div><script src="q1.js"></script><script src="q2.js"></script><script src="q3.js"></script><script src="q4.js"></script><script>
const Q=window.ACLS_QUESTIONS,S=JSON.parse(localStorage.getItem('aclsMegaSave')||'{"done":0,"correct":0,"wrong":{},"seen":{},"streak":0}');let list=[],idx=0,score=0,mode='';
const $=x=>document.querySelector(x);function save(){localStorage.setItem('aclsMegaSave',JSON.stringify(S));stats()}function stats(){$('#done').textContent=S.done||0;$('#acc').textContent=S.done?Math.round(S.correct/S.done*100)+'%':'0%';$('#wrong').textContent=Object.keys(S.wrong||{}).length;$('#covered').textContent=Object.keys(S.seen||{}).length+'/206';$('#streak').textContent='🔥 '+(S.streak||0)}function hide(){['home','quiz','mega','case'].forEach(x=>$('#'+x).classList.add('hidden'))}function home(){hide();$('#home').classList.remove('hidden');renderChapters();stats();scrollTo(0,0)}
function renderChapters(){let m={};Q.forEach(x=>(m[x.chapter]??=[]).push(x));$('#chapters').innerHTML=Object.entries(m).map(([c,a])=>`<button class="card chapter" onclick='startChapter(${JSON.stringify(c)})'><b>${c}</b><small>${a.length} 題</small></button>`).join('')}
function begin(a,m){list=a;idx=0;score=0;mode=m;hide();$('#quiz').classList.remove('hidden');renderQ()}function startAll(){begin([...Q],'全部題庫')}function startMock(){begin([...Q].sort(()=>Math.random()-.5).slice(0,50),'50 題模擬考')}function startWrong(){let a=Q.filter(x=>S.wrong&&S.wrong[x.id]);if(!a.length)return alert('目前沒有錯題紀錄。');begin(a,'錯題再測')}function startChapter(c){begin(Q.filter(x=>x.chapter===c),c)}
function renderQ(){let x=list[idx];$('#prog').textContent=`${idx+1} / ${list.length}`;$('#bar').style.width=((idx)/list.length*100)+'%';$('#label').textContent=`${mode}｜題號 ${x.id}｜${x.chapter}`;$('#q').textContent=x.q;$('#opts').innerHTML=x.options.map((o,i)=>`<button class="option" onclick="answer(${i})"><b>${'ABCD'[i]}.</b> ${o}</button>`).join('');$('#fb').classList.add('hidden');$('#next').classList.add('hidden')}
function answer(i){let x=list[idx],ok=i===x.answer;document.querySelectorAll('#opts .option').forEach((b,j)=>{b.disabled=true;if(j===x.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});S.done++;S.seen[x.id]=1;if(ok){S.correct++;S.streak++;score++}else{S.streak=0;S.wrong[x.id]=(S.wrong[x.id]||0)+1}save();$('#fb').innerHTML=`<strong>${ok?'答對了':'正確答案：'+ 'ABCD'[x.answer]}</strong><br>${x.explain}`;$('#fb').classList.remove('hidden');$('#next').classList.remove('hidden')}
function nextQ(){if(++idx>=list.length){alert(`完成！本次 ${score}/${list.length}，正確率 ${Math.round(score/list.length*100)}%`);home()}else renderQ()}
const CASES=[['VF 反覆電擊',['58歲男性突然倒地，無反應、無脈搏，監視器顯示 VF。','第一次去顫後仍為 VF。','第二次去顫後仍為 VF，IV 已建立。','第三次去顫後仍為 VF。'],[['開始高品質 CPR 並立即去顫','先插管','Atropine','同步整流'],['立即恢復 CPR 2 分鐘','立刻摸脈搏','連續電擊三次','Adenosine'],['CPR 並給 Epinephrine 1 mg','Atropine 1 mg','Dopamine infusion','停止 CPR'],['CPR 並給 Amiodarone 300 mg','Adenosine 6 mg','同步整流 100J','只觀察']],[0,0,0,0]],['PEA—低血容',['術後病人突然無脈搏，監視器有窄 QRS，頸靜脈不怒張。','快速評估顯示可能大量出血。'],[['高品質 CPR、Epinephrine、找 5H5T','去顫','Adenosine','Atropine'],['快速輸液／血品並控制出血','同步整流','Amiodarone','停止復甦']],[0,0]],['PEA—張力性氣胸',['插管病人突然低血壓、無脈搏，右側呼吸音消失、頸靜脈怒張。','最可能原因已鎖定。'],[['CPR 並搜尋可逆原因','立即去顫','Adenosine','觀察'],['立即胸部減壓','補充 Atropine','同步整流','只給氧']],[0,0]],['Asystole',['病人無反應無脈搏，兩導程確認 Asystole。'],[['CPR、Epinephrine、找 5H5T','去顫 200J','Atropine','Adenosine'],[0]],['Torsades 無脈搏',['病人無脈搏，呈多型性 VT、扭轉型波形。'],[['立即去顫、CPR，考慮 Magnesium','同步整流','Adenosine','Atropine'],[0]],['有症狀心搏過緩',['HR 38/min，血壓 76/40，意識混亂。','Atropine 無效。'],[['Atropine 1 mg IV','Adenosine','同步整流','Amiodarone'],['TCP，並考慮 Dopamine／Epinephrine infusion','觀察','去顫','Aspirin'],[0,0]],['高度 AV block',['HR 32/min，第三度 AV block，胸痛與低血壓。'],[['準備 TCP 並支持 ABC','Adenosine','去顫','只觀察'],[0]],['穩定 PSVT',['規則窄 QRS，HR 180，血壓 118/70，意識清楚。','迷走神經刺激無效。'],[['迷走神經刺激','同步整流','Amiodarone','去顫'],['Adenosine 6 mg 快速推注','Atropine','Epinephrine','Lidocaine'],[0,0]],['不穩定窄 QRS 心搏過速',['HR 190，血壓 70/40，胸痛、冒冷汗。'],[['同步整流，若可行先鎮靜','迷走刺激後等待','只給 Adenosine','去顫'],[0]],['穩定單型寬 QRS',['規則寬 QRS，HR 160，血壓穩定，無胸痛。'],[['考慮抗心律不整藥與專家會診','立即去顫','Atropine','只給氧'],[0]],['不穩定單型 VT',['有脈搏單型 VT，血壓 68/38，意識改變。'],[['同步整流','Adenosine 後觀察','Atropine','CPR'],[0]],['ROSC 後照護',['VF 復甦後恢復脈搏，SpO₂ 88%，仍昏迷。'],[['確保氧合通氣、維持血壓、12導程 ECG 與溫度控制','立即停止監測','常規過度換氣','只給鎮靜'],[0]]];
let ci=0,si=0;function showMega(){hide();$('#mega').classList.remove('hidden');$('#megaList').innerHTML=CASES.map((c,i)=>`<button class="card chapter" onclick="startCase(${i})"><b>${i+1}. ${c[0]}</b><small>${c[1].length} 個連續決策</small></button>`).join('')}function startCase(i){ci=i;si=0;hide();$('#case').classList.remove('hidden');renderStep()}function renderStep(){let c=CASES[ci];$('#caseProg').textContent=`${si+1}/${c[1].length}`;$('#caseTitle').textContent=c[0];$('#caseText').textContent=c[1][si];$('#vitals').innerHTML='<div>角色：Team Leader</div><div>決策時間：建議 30 秒</div>';$('#caseQ').textContent='下一個最優先處置是？';$('#caseOpts').innerHTML=c[2][si].map((o,i)=>`<button class="option" onclick="answerStep(${i})">${o}</button>`).join('');$('#caseFb').classList.add('hidden');$('#caseNext').classList.add('hidden')}function answerStep(i){let c=CASES[ci],a=c[3][si];document.querySelectorAll('#caseOpts .option').forEach((b,j)=>{b.disabled=true;if(j===a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('#caseFb').innerHTML=i===a?'<strong>決策正確。</strong> 團隊可繼續下一階段。':'<strong>決策需要修正。</strong> 請依脈搏、是否可電擊與病人穩定度重新判斷。';$('#caseFb').classList.remove('hidden');$('#caseNext').classList.remove('hidden')}function nextStep(){let c=CASES[ci];if(++si>=c[1].length){alert('MegaCode 情境完成！');showMega()}else renderStep()}home();
</script></body></html>
