<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ACLS Exam Rush｜考前衝刺</title><style>:root{--bg:#08111f;--card:#111e31;--text:#eef7ff;--muted:#9db1c7;--cyan:#49d7ff;--green:#6df2ad;--red:#ff6f86;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:radial-gradient(circle at top,#163154 0,#08111f 42%);color:var(--text);min-height:100vh}button{font:inherit}.app{max-width:980px;margin:auto;padding:18px 16px 96px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}h1{font-size:clamp(1.45rem,5vw,2.3rem);margin:0}.sub{color:var(--muted);font-size:.9rem}.pill{background:#163154;border:1px solid #28486d;padding:8px 12px;border-radius:999px;font-weight:800}.hero,.panel{background:linear-gradient(145deg,rgba(24,45,74,.96),rgba(13,28,47,.96));border:1px solid #294b73;border-radius:24px;box-shadow:0 18px 50px #0007}.hero{padding:22px;margin-bottom:16px}.hero h2{margin:0 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#0b1728;border-radius:16px;padding:14px;text-align:center}.stat b{font-size:1.35rem;display:block}.stat span{font-size:.75rem;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}.btn{border:0;border-radius:16px;padding:15px 14px;background:linear-gradient(135deg,var(--cyan),#5b7cff);color:#03101d;font-weight:900;cursor:pointer}.btn.secondary{background:#1b304d;color:var(--text);border:1px solid #315579}.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.chapter{text-align:left;background:var(--card);border:1px solid #294b73;color:var(--text);border-radius:18px;padding:16px;cursor:pointer}.chapter b{display:block;font-size:1.05rem}.chapter span{color:var(--muted);font-size:.8rem}.bar{height:8px;background:#07101d;border-radius:999px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}.hidden{display:none!important}.quiz{padding:18px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.question{font-size:1.2rem;line-height:1.55;margin:18px 0}.option{width:100%;text-align:left;background:#0b1728;color:var(--text);border:1px solid #2b496c;border-radius:15px;padding:14px;margin:8px 0;cursor:pointer}.option.correct{border-color:var(--green);background:#12382d}.option.wrong{border-color:var(--red);background:#401d2a}.option:disabled{cursor:default}.feedback{margin-top:14px;padding:14px;border-radius:15px;background:#0b1728;color:var(--muted);line-height:1.55}.feedback strong{color:var(--text)}.result{padding:24px;text-align:center}.score{font-size:4rem;font-weight:950;color:var(--gold)}.tiny{font-size:.76rem;color:var(--muted)}.bottom{position:fixed;left:0;right:0;bottom:0;background:#08111fee;backdrop-filter:blur(14px);border-top:1px solid #244362;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}.bottom button{max-width:300px;flex:1}@media(max-width:600px){.actions{grid-template-columns:1fr}.app{padding-left:12px;padding-right:12px}}</style></head><body><main class="app"><header><div><h1>⚡ ACLS Exam Rush</h1><div class="sub">2026 課前題庫｜考前重點、錯題再測、模擬考</div></div><div class="pill" id="streak">🔥 0</div></header><section id="home"><div class="hero"><h2>明天上場，今天把分數救回來。</h2><div class="sub">依題庫核心概念整理；每題作答後立即顯示解析，錯題會自動收進複習區。</div><div class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="accuracy">0%</b><span>正確率</span></div><div class="stat"><b id="wrongCount">0</b><span>待複習</span></div></div></div><div class="actions"><button class="btn" onclick="startMock()">開始 20 題模擬考</button><button class="btn secondary" onclick="startWrong()">錯題再測</button></div><h2>分章練習</h2><div id="chapters" class="chapters"></div></section><section id="quiz" class="panel quiz hidden"><div class="topline"><button class="btn secondary" onclick="goHome()">← 返回</button><div class="pill" id="progress">1 / 10</div></div><div class="tiny" id="chapterLabel"></div><div class="question" id="question"></div><div id="options"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="btn hidden" style="width:100%;margin-top:14px" onclick="nextQuestion()">下一題</button></section><section id="result" class="panel result hidden"><div class="tiny">本次成績</div><div class="score" id="score">0%</div><h2 id="rank"></h2><p class="sub" id="summary"></p><div class="actions"><button class="btn" onclick="retryCurrent()">再測一次</button><button class="btn secondary" onclick="goHome()">返回首頁</button></div></section></main><div class="bottom"><button class="btn secondary" onclick="goHome()">首頁</button><button class="btn" onclick="startWrong()">錯題複習</button></div><script>const Q=[{"chapter":"BLS","q":"成人院外心跳停止生存之鏈的第一步為何？","options":["早期求救並啟動緊急應變系統","建立進階呼吸道","先給腎上腺素","先進行心導管"],"answer":0,"explain":"成人生存之鏈由早期求救開始，接著高品質 CPR、早期去顫、進階救命術、心跳停止後照護與復原。"},{"chapter":"BLS","q":"專業人員檢查成人脈搏不應超過多久？","options":["5 秒","10 秒","15 秒","30 秒"],"answer":1,"explain":"脈搏檢查不超過 10 秒；無法確認脈搏即開始 CPR。"},{"chapter":"BLS","q":"成人高品質胸部按壓速率為何？","options":["80–100 次/分","90–110 次/分","100–120 次/分","120–140 次/分"],"answer":2,"explain":"成人胸部按壓速率為每分鐘 100–120 次。"},{"chapter":"BLS","q":"成人胸部按壓深度為何？","options":["3–4 公分","4–5 公分","5–6 公分","至少 7 公分"],"answer":2,"explain":"成人建議按壓深度 5–6 公分，並讓胸部完全回彈。"},{"chapter":"BLS","q":"已建立進階呼吸道後，成人 CPR 的通氣頻率為何？","options":["每 3 秒 1 次","每 6 秒 1 次","每 10 秒 1 次","仍維持 30:2"],"answer":1,"explain":"持續壓胸，通氣每 6 秒 1 次，也就是每分鐘 10 次。"},{"chapter":"BLS","q":"量化波形 ETCO₂ 持續低於 10 mmHg 時，最適當作法為何？","options":["停止 CPR","改善胸部按壓品質","立即同步電擊","改為腹部按壓"],"answer":1,"explain":"PETCO₂ 持續低於 10 mmHg 常提示灌流與壓胸品質需要改善。"},{"chapter":"AED","q":"AED 的正確操作順序為何？","options":["貼片→開機→分析→電擊","開機→貼片→分析→電擊","開機→分析→貼片→電擊","分析→開機→貼片→電擊"],"answer":1,"explain":"通用步驟為開啟電源、貼上電極片、分析心律、確認安全後電擊。"},{"chapter":"AED","q":"AED 電擊一次後，下一步為何？","options":["立即檢查脈搏","立即恢復 CPR 2 分鐘","再次連續電擊兩次","移除 AED"],"answer":1,"explain":"電擊後不要停下來找脈搏，應立即恢復 CPR 約 2 分鐘。"},{"chapter":"AED","q":"溺水病人需要使用 AED 時應先做什麼？","options":["完全擦乾全身","擦乾胸前貼片位置","等待 10 分鐘","禁止使用 AED"],"answer":1,"explain":"應快速擦乾胸前貼片區域，避免水分分散電流。"},{"chapter":"氣道","q":"嚴重呼吸道異物阻塞者仍有意識且無法說話，適當處置為何？","options":["鼓勵喝水","5 次背部拍擊與 5 次腹部推擠交替","立即口對口吹氣","只觀察"],"answer":1,"explain":"清醒嚴重阻塞採背部拍擊與腹部推擠交替，直到異物排出或失去反應。"},{"chapter":"氣道","q":"末期懷孕或嚴重肥胖者發生嚴重異物阻塞，應以何者取代腹部推擠？","options":["胸部推擠","頸部推擠","背部按摩","仰臥抬腿"],"answer":0,"explain":"無法環抱腹部時改採胸部推擠。"},{"chapter":"氣道","q":"使用 BVM 對成人通氣，理想潮氣量約為何？","options":["200–300 mL","500–600 mL","800–1000 mL","1200 mL"],"answer":1,"explain":"約 500–600 mL，以可見胸部起伏為原則，避免過度換氣。"},{"chapter":"氣道","q":"懷疑頸椎受傷時，優先用何種方式打開呼吸道？","options":["壓額抬顎法","下顎推擠法","環狀軟骨按壓","腹部推擠"],"answer":1,"explain":"先採下顎推擠法；若仍無法有效通氣，氣道與氧合優先。"},{"chapter":"氣道","q":"已插管病人突然低血氧，DOPE 中的 O 代表什麼？","options":["氧氣不足","阻塞","過度換氣","食道插管"],"answer":1,"explain":"DOPE：Displacement、Obstruction、Pneumothorax、Equipment failure。"},{"chapter":"心跳停止","q":"下列何者是可電擊心律？","options":["PEA","Asystole","VF／無脈性 VT","竇性心搏過緩"],"answer":2,"explain":"VF 與無脈性 VT 為可電擊心律；PEA 與 Asystole 不電擊。"},{"chapter":"心跳停止","q":"PEA 病人的第一優先處置為何？","options":["同步電擊","高品質 CPR","Adenosine","Atropine"],"answer":1,"explain":"PEA 應立即高品質 CPR、給 Epinephrine，並尋找 5H5T。"},{"chapter":"心跳停止","q":"PEA／Asystole 時 Epinephrine 成人標準劑量為何？","options":["0.5 mg 每 10 分鐘","1 mg 每 3–5 分鐘","2 mg 單次","5 mg 每 2 分鐘"],"answer":1,"explain":"成人心跳停止 Epinephrine 1 mg IV/IO，每 3–5 分鐘重複。"},{"chapter":"心跳停止","q":"下列何者不屬於 5H5T？","options":["低血氧","低血容","肺水腫","張力性氣胸"],"answer":2,"explain":"肺水腫不是標準 5H5T；可逆原因包括低血氧、低血容、高低血鉀、酸中毒、低體溫，以及五項 T。"},{"chapter":"心跳停止","q":"VF／無脈性 VT 電擊後應如何處理？","options":["立即恢復 CPR","先檢查脈搏 30 秒","立刻插管後再壓胸","停止壓胸等待節律恢復"],"answer":0,"explain":"電擊後立即恢復 CPR 2 分鐘，減少壓胸中斷。"},{"chapter":"心跳停止","q":"Asystole 的處置何者正確？","options":["立即去顫","使用 Atropine","高品質 CPR＋Epinephrine＋找可逆原因","使用 Adenosine"],"answer":2,"explain":"Asystole 不電擊，也不使用 Atropine；核心是 CPR、Epinephrine 與 5H5T。"},{"chapter":"心律","q":"寬 QRS 的定義為何？","options":["≥0.08 秒","≥0.10 秒","≥0.12 秒","≥0.20 秒"],"answer":2,"explain":"QRS ≥0.12 秒，也就是至少 3 小格，視為寬 QRS。"},{"chapter":"心律","q":"第一度房室傳導阻滯的 PR interval 定義為何？","options":["大於 0.12 秒","大於 0.16 秒","大於 0.20 秒","大於 0.30 秒"],"answer":2,"explain":"第一度 AV block 為 PR interval >0.20 秒。"},{"chapter":"心律","q":"規則、快速、窄 QRS 且看不到明顯 P 波，最可能為何？","options":["PSVT","Atrial fibrillation","Ventricular fibrillation","Asystole"],"answer":0,"explain":"PSVT 常呈快速、規則、窄 QRS，P 波不明顯。"},{"chapter":"心律","q":"Torsades de pointes 最常與何者相關？","options":["QT 延長","PR 縮短","低血糖","ST 壓低"],"answer":0,"explain":"Torsades de pointes 與 QT prolongation 密切相關。"},{"chapter":"心搏過緩","q":"穩定、無症狀的心搏過緩，最適當處置為何？","options":["立即 TCP","立即 Atropine","觀察監測並尋找原因","同步電擊"],"answer":2,"explain":"沒有低灌流徵象時先觀察、監測並處理原因。"},{"chapter":"心搏過緩","q":"有症狀心搏過緩的第一線藥物通常為何？","options":["Adenosine","Atropine","Amiodarone","Lidocaine"],"answer":1,"explain":"有症狀心搏過緩可先使用 Atropine，必要時 TCP 或升壓藥滴注。"},{"chapter":"心搏過速","q":"不穩定心搏過速合併低血壓、胸痛或意識改變，優先處置為何？","options":["同步電擊","去顫","只給氧氣","觀察 30 分鐘"],"answer":0,"explain":"有脈搏但不穩定的心搏過速應優先同步電擊。"},{"chapter":"心搏過速","q":"規則窄 QRS 心搏過速，迷走神經刺激無效後，可考慮何藥？","options":["Epinephrine","Adenosine","Atropine","Magnesium sulfate"],"answer":1,"explain":"規則窄 QRS 心搏過速可用 Adenosine，首劑常為 6 mg 快速推注。"},{"chapter":"ACS","q":"疑似 ACS 病人，到院後應盡快於多久內完成 12 導程心電圖？","options":["5 分鐘","10 分鐘","30 分鐘","60 分鐘"],"answer":1,"explain":"疑似急性冠心症通常目標為到院 10 分鐘內完成 12 導程 ECG。"},{"chapter":"ACS","q":"STEMI 合併低血壓時，下列何者通常應避免？","options":["Nitroglycerin","Aspirin","氧氣（若低血氧）","心導管評估"],"answer":0,"explain":"低血壓、右心室梗塞或近期使用 PDE-5 抑制劑時，NTG 可能造成危險性低血壓。"},{"chapter":"中風","q":"Cincinnati 中風評估不包含哪一項？","options":["臉歪","手臂下垂","語言異常","瞳孔大小"],"answer":3,"explain":"Cincinnati 包含 facial droop、arm drift、abnormal speech。"},{"chapter":"中風","q":"疑似急性中風到院後，最優先的影像檢查通常為何？","options":["有顯影劑胸部 CT","無顯影劑腦部 CT","腹部超音波","MRI 心臟"],"answer":1,"explain":"無顯影劑腦部 CT 用來快速排除顱內出血。"},{"chapter":"中風","q":"疑似中風病人血糖 40 mg/dL，最適當處置為何？","options":["先給葡萄糖","立即降血壓","只做 CT","給 Adenosine"],"answer":0,"explain":"低血糖可模仿中風症狀，應立即矯正。"},{"chapter":"ROSC","q":"ROSC 後若病人無法遵從指令，照護重點之一為何？","options":["維持正常氧合並避免高氧","立刻停止監測","常規大量過度換氣","不需評估病因"],"answer":0,"explain":"ROSC 後應精準控制氧合、通氣、血壓、體溫，並處理病因。"},{"chapter":"團隊","q":"MegaCode 團隊領導者最重要的行為為何？","options":["自己完成所有技術","封閉式溝通與清楚分工","避免重複確認","不需說出處置"],"answer":1,"explain":"閉環溝通、角色分工、摘要與再評估能降低錯誤。"}];const KEY='aclsExamRushV1';let save=JSON.parse(localStorage.getItem(KEY)||'{}');save.done=save.done||0;save.correct=save.correct||0;save.wrong=save.wrong||{};save.chapter=save.chapter||{};save.streak=save.streak||0;let session=[],idx=0,score=0,lastMode=null,locked=false;const $=s=>document.querySelector(s);const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function persist(){localStorage.setItem(KEY,JSON.stringify(save));renderHome()}function renderHome(){$('#done').textContent=save.done;$('#accuracy').textContent=save.done?Math.round(save.correct/save.done*100)+'%':'0%';$('#wrongCount').textContent=Object.keys(save.wrong).length;$('#streak').textContent='🔥 '+save.streak;const chapters=[...new Set(Q.map(x=>x.chapter))];$('#chapters').innerHTML=chapters.map(c=>{let qs=Q.filter(x=>x.chapter===c),r=save.chapter[c]||{done:0,correct:0},p=r.done?Math.round(r.correct/r.done*100):0;return `<button class="chapter" onclick="startChapter('${c}')"><b>${c}</b><span>${qs.length} 題｜掌握 ${p}%</span><div class="bar"><i style="width:${p}%"></i></div></button>`}).join('')}function show(id){['home','quiz','result'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));scrollTo(0,0)}function startChapter(c){lastMode={type:'chapter',value:c};start(shuffle(Q.filter(x=>x.chapter===c)))}function startMock(){lastMode={type:'mock'};start(shuffle(Q).slice(0,20))}function startWrong(){let arr=Object.keys(save.wrong).map(Number).map(i=>Q[i]).filter(Boolean);if(!arr.length){alert('目前沒有錯題，先去挑戰一輪吧！');return}lastMode={type:'wrong'};start(shuffle(arr))}function start(arr){session=arr;idx=0;score=0;locked=false;show('quiz');renderQuestion()}function renderQuestion(){locked=false;const q=session[idx];$('#progress').textContent=`${idx+1} / ${session.length}`;$('#chapterLabel').textContent=q.chapter;$('#question').textContent=q.q;$('#feedback').classList.add('hidden');$('#next').classList.add('hidden');$('#options').innerHTML=q.options.map((o,i)=>`<button class="option" onclick="answer(${i},this)"><b>${String.fromCharCode(65+i)}.</b> ${o}</button>`).join('')}function answer(choice){if(locked)return;locked=true;const q=session[idx],ok=choice===q.answer,gi=Q.indexOf(q);save.done++;save.chapter[q.chapter]=save.chapter[q.chapter]||{done:0,correct:0};save.chapter[q.chapter].done++;if(ok){score++;save.correct++;save.chapter[q.chapter].correct++;save.streak++;delete save.wrong[gi]}else{save.streak=0;save.wrong[gi]=(save.wrong[gi]||0)+1}[...document.querySelectorAll('.option')].forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});$('#feedback').innerHTML=`<strong>${ok?'答對了！':'這題先救回來。'}</strong><br>${q.explain}`;$('#feedback').classList.remove('hidden');$('#next').textContent=idx===session.length-1?'查看成績':'下一題';$('#next').classList.remove('hidden');persist()}function nextQuestion(){if(idx<session.length-1){idx++;renderQuestion()}else finish()}function finish(){let pct=Math.round(score/session.length*100);$('#score').textContent=pct+'%';$('#rank').textContent=pct>=90?'S 級｜考場穩了':pct>=80?'A 級｜再補兩個弱點':pct>=70?'B 級｜已過線，繼續衝':'C 級｜立即錯題再測';$('#summary').textContent=`答對 ${score} / ${session.length} 題；錯題已自動加入複習。`;show('result')}function retryCurrent(){if(lastMode?.type==='chapter')startChapter(lastMode.value);else if(lastMode?.type==='wrong')startWrong();else startMock()}function goHome(){show('home');renderHome()}renderHome();</script></body></html>
